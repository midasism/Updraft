name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: 编译（Debug）
        run: swift build --disable-sandbox

      - name: 单元测试
        run: swift test --disable-sandbox

      - name: 编译（Release）
        run: swift build -c release --disable-sandbox
