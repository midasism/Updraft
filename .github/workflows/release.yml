name: Release

# 打 v* 标签即发布：编译 release、组装 .app、压 zip、附校验和、创建 Release。
# 手动触发（Actions 页面 → Run workflow）只出可下载的构建产物，不建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀），仅手动触发时使用'
        required: true
        default: '0.1.0'

# 创建 Release 需要写 contents 权限；默认 token 只有只读
permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: macos-latest
    env:
      # 证书身份名不算敏感，但仍然从 secret 取，免得把个人名字硬编码进仓库。
      # 没配时这里是空串，build-app.sh 会自动退回 ad-hoc 签名。
      CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # gh release create --generate-notes 要读历史 tag 来算增量说明
          fetch-depth: 0

      - name: 解析版本号
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=Updraft-${VERSION}-macOS.zip" >> "$GITHUB_OUTPUT"
          echo "dmg=Updraft-${VERSION}-macOS.dmg" >> "$GITHUB_OUTPUT"
          echo "→ 版本 $VERSION"

      # 没配证书时这一步什么都不做，后面的签名与公证会自动降级。
      # 也就是说：还没买开发者账号之前，整条流水线照样是通的，产物和以前一模一样。
      - name: 导入 Developer ID 证书（未配置则跳过）
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "→ 未配置 APPLE_CERT_P12，跳过导入"
            echo "  本次产物为 ad-hoc 未公证：功能正常，但用户首次打开需清 quarantine（见 README「安装」）"
            exit 0
          fi

          # 临时 keychain：不碰 runner 的默认钥匙串，跑完即删
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          # 用 openssl 解码而不是 base64 -d：macOS 自带的 base64 历史上只认 -D，写 -d 有版本风险
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 不设 partition-list，codesign 会卡在授权弹窗上——CI 里没有可点的弹窗，直接失败
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC" >/dev/null

          # 把临时 keychain 加进搜索列表，否则 codesign 根本找不到这张证书
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "✔ 证书已导入临时 keychain："
          security find-identity -v -p codesigning "$KC"

      - name: 编译并组装 .app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh

      # 凭据缺失时脚本自己跳过（exit 0），不会打断流水线。
      # 插在这里而不是最后：票据必须钉在 .app 上，之后才能拿它去出 dmg 和 zip。
      - name: 公证并 staple（未配置凭据则跳过）
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: scripts/notarize.sh

      # DMG 需要 hdiutil（macOS 独有）和 dmgbuild，后者由脚本自己装进 .build/ 下的虚拟环境
      - name: 生成 DMG 安装镜像
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SKIP_APP_BUILD: '1'
        run: scripts/build-dmg.sh

      - name: 收集产物并生成校验和
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
          DMG: ${{ steps.meta.outputs.dmg }}
        run: |
          # 必须是 ditto：zip -r 会丢掉 .app 内部的符号链接与权限位，解压后包是坏的
          ditto -c -k --sequesterRsrc --keepParent dist/AppUpdater.app "$ZIP"

          # 两个包收进同一个目录再算校验和，SHA256SUMS.txt 里才能是裸文件名——
          # 用户把三个文件下到同一个文件夹后，shasum -a 256 -c 才直接可用
          mkdir -p artifacts
          cp "$ZIP" "dist/$DMG" artifacts/
          cd artifacts
          shasum -a 256 "$ZIP" "$DMG" > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      # 每次运行都留一份可直接下载的构建产物（Actions 页面底部 Artifacts）
      - uses: actions/upload-artifact@v4
        with:
          name: Updraft-${{ steps.meta.outputs.version }}
          path: artifacts/
          retention-days: 90

      - name: 创建 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Updraft v$VERSION" \
            --generate-notes \
            --verify-tag

      # 无论前面成败都清掉临时 keychain，别把私钥留在 runner 上
      - name: 清理临时 keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KC" ]; then
            security delete-keychain "$KC" || true
            echo "✔ 临时 keychain 已删除"
          fi
